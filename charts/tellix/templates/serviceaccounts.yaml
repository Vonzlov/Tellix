# Two identities, not one. The API and the operator need very different
# things from the cluster, and giving each only what it needs means a bug
# in one cannot do the other's damage: the API can create and delete
# runs but cannot touch a single Job, and the operator can manage Jobs
# but cannot delete a run.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "tellix.fullname" . }}-api
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "tellix.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "tellix.fullname" . }}-operator
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "tellix.labels" . | nindent 4 }}
    app.kubernetes.io/component: operator
