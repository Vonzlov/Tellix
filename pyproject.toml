[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
# ruff's own defaults (pyflakes, plus the pycodestyle errors that are
# actual errors rather than style opinions), with import sorting and
# flake8-bugbear's correctness checks on top.
select = ["E4", "E7", "E9", "F", "I", "B"]
